[versions]
# --- Build tooling (TARGET originals) ---
agp = "9.2.1"
kotlin = "2.2.10"
ksp = "2.3.2"

# --- Compose stack (TARGET originals + SOURCE additions) ---
composeBom = "2024.09.00"
composeMaterial3 = "1.5.6"
composeFoundation = "1.5.6"
composeUiTooling = "1.5.6"
wearToolingPreview = "1.0.0"
activityCompose = "1.8.0"
coreSplashscreen = "1.2.0"

# --- Wear Compose Material 2 (added for SOURCE screens coexistence) ---
wearComposeMaterial2 = "1.3.0"
wearComposeNavigation = "1.3.0"

# --- AndroidX libraries (SOURCE additions) ---
playServicesWearable = "18.0.0"
fragmentKtx = "1.6.2"
wear = "1.3.0"
coreKtx = "1.12.0"

# --- Persistence / background (SOURCE additions) ---
room = "2.7.0"
workManager = "2.9.0"

# --- Coroutines (SOURCE additions) ---
kotlinxCoroutines = "1.7.3"

# --- Network (adapter additions) ---
retrofit = "2.11.0"
okhttp = "4.12.0"
moshi = "1.15.1"

# --- DataStore (adapter X-Watch-Key persistence) ---
datastorePreferences = "1.1.1"

# --- Test (SOURCE additions) ---
junit4 = "4.13.2"
robolectric = "4.14.1"
androidxTestCore = "1.5.0"
androidxTestExtJunit = "1.1.5"

[libraries]
# --- Compose (TARGET originals) ---
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
ui = { group = "androidx.compose.ui", name = "ui" }
ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "composeMaterial3" }
compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "composeFoundation" }
compose-ui-tooling = { group = "androidx.wear.compose", name = "compose-ui-tooling", version.ref = "composeUiTooling" }
wear-tooling-preview = { group = "androidx.wear", name = "wear-tooling-preview", version.ref = "wearToolingPreview" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

# --- Wear Compose Material 2 (coexists with M3 for SOURCE screens) ---
wear-compose-material2 = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearComposeMaterial2" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearComposeNavigation" }

# --- AndroidX (SOURCE deps) ---
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
wear = { group = "androidx.wear", name = "wear", version.ref = "wear" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# --- Room (SOURCE deps) ---
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- WorkManager (SOURCE deps) ---
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# --- Coroutines (SOURCE deps) ---
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# --- Network (PartnerApiAdapter) ---
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
moshi = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }

# --- DataStore (X-Watch-Key persistence) ---
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

# --- Test (SOURCE deps) ---
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-test-ext-junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
