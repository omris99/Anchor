<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1056" width="1024" height="1056">
  <defs>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="55%"  stop-color="#F0FAFB"/>
      <stop offset="100%" stop-color="#D8F0F3"/>
    </linearGradient>

    <radialGradient id="blob" cx="0%" cy="0%" r="65%">
      <stop offset="0%"   stop-color="#A8DDE4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A8DDE4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#B8E4EA" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#48AEBE" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="wg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9AD8E0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3A9BAC" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="wg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7ECAD3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2E8C9C" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="wg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#60BDC8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2A838F" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="wg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#48AEBE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#246E79" stop-opacity="0.48"/>
    </linearGradient>

  </defs>

  <!-- Background -->
  <rect width="1024" height="1056" fill="url(#bgGrad)"/>

  <!-- Top-left blob -->
  <ellipse cx="0" cy="0" rx="619" ry="272" fill="url(#blob)"/>

  <!-- Wave 1 — back, highest -->
  <path d="
    M 0 612
    C 257 553  767 671  1024 612
    L 1024 1056 L 0 1056 Z"
    fill="url(#wg1)"
  />

  <!-- Wave 2 -->
  <path d="
    M 0 680
    C 257 739  767 621  1024 680
    L 1024 1056 L 0 1056 Z"
    fill="url(#wg2)"
  />

  <!-- Wave 3 -->
  <path d="
    M 0 742
    C 257 683  767 801  1024 742
    L 1024 1056 L 0 1056 Z"
    fill="url(#wg3)"
  />

  <!-- Wave 4 -->
  <path d="
    M 0 804
    C 257 863  767 745  1024 804
    L 1024 1056 L 0 1056 Z"
    fill="url(#wg4)"
  />

  <!-- Wave 5 — front, lowest -->
  <path d="
    M 0 870
    C 257 811  767 929  1024 870
    L 1024 1056 L 0 1056 Z"
    fill="url(#wg5)"
  />

